name: Published content scan
on:
  repository_dispatch:
    types: [cms-publication]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - run: node scripts/scan.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
